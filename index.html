.hint{background:#EFF6FF;border-radius:10px;padding:13px 14px;margin-top:16px;font-size:13px;color:#1E40AF;line-height:1.8;}

// Universal HTTP request that works on ANY browser (Chrome, Safari, Firefox, Edge, Samsung, UC, Opera)
function httpReq(method, url, data=null, timeoutMs=6000){
  return new Promise((resolve, reject) => {
    let resolved = false;
    const timer = setTimeout(() => {
      if(!resolved){ resolved = true; reject(new Error('timeout')); }

          if(!resolved){ resolved = true; clearTimeout(timer); reject(new Error('network_error')); }
        };
        xhr.send(data ? JSON.stringify(data) : null);
      } catch(e) {
        if(!resolved){ resolved = true; clearTimeout(timer); reject(e); }
      }
    }
  });
}

const D={
  r:p=>db?db.ref(ROOT+'/'+p):null,
  get:async p=>{
    const url = `${FB_URL}${ROOT}/${p}.json?_t=${Date.now()}`;
    try{
      const res = await httpReq('GET', url, null, 4500);
      if(res.ok && res.json !== undefined) return res.json;
    }catch(e){}
    if(db){
      try{
        const snap = await withTimeout(D.r(p).once('value'), 5000);
        return snap.val();
      }catch(err){}
    }
    return null;
  },
  set:async(p,v)=>{
    try{
      if(db){ await withTimeout(D.r(p).set(v), 4000); return; }
    }catch(e){}
    try{
      await httpReq('PUT', `${FB_URL}${ROOT}/${p}.json`, v, 5000);
    }catch(err){console.warn('Set error:', err);}
  },
  push:async(p,v)=>{
    try{
      if(db){
        const r=await withTimeout(D.r(p).push(v), 4000);
        return r.key;
      }
    }catch(e){}
    try{
      const res = await httpReq('POST', `${FB_URL}${ROOT}/${p}.json`, v, 5000);
      if(res.json && res.json.name) return res.json.name;
    }catch(err){}
    return 'k_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
  },
  upd:async(p,v)=>{
    try{
      if(db){ await withTimeout(D.r(p).update(v), 4000); return; }
    }catch(e){}
    try{
      await httpReq('PATCH', `${FB_URL}${ROOT}/${p}.json`, v, 5000);
    }catch(err){console.warn('Upd error:', err);}
  },
  del:async p=>{
    try{
      if(db){ await withTimeout(D.r(p).remove(), 4000); return; }
    }catch(e){}
    try{
      await httpReq('DELETE', `${FB_URL}${ROOT}/${p}.json`, null, 5000);
    }catch(err){console.warn('Del error:', err);}
  },
  key:()=>{
    try{ return db.ref().push().key; }catch{ return 'k_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
  }
};

function ytSrc(url){
  if(!url) return null;
  // Playlist
  if(url.includes('list=')){
    const m = url.match(/[?&]list=([^&#]+)/);
    if(m) return `https://www.youtube.com/embed/videoseries?list=${m[1]}`;
  }
  // Short youtu.be
  const shortMatch = url.match(/youtu\.be\/([^?&#]+)/);
  if(shortMatch) return `https://www.youtube.com/embed/${shortMatch[1]}`;
  // Standard watch?v=
  const vMatch = url.match(/[?&]v=([^&#]+)/);
  if(vMatch) return `https://www.youtube.com/embed/${vMatch[1]}`;
  // Embed format already
  const embMatch = url.match(/youtube\.com\/embed\/([^?&#]+)/);
  if(embMatch) return `https://www.youtube.com/embed/${embMatch[1]}`;
  return null;
}

async function doLogin(){
  const btn=$('login-btn'), err=$('login-err');
  err.style.display='none';
  const rawUname=$('l-user').value.trim();
  const uname=rawUname.toLowerCase();
  const pass=$('l-pass').value.trim();
  if(!rawUname||!pass){showErr('Enter username and password');return;}
  btn.disabled=true;btn.textContent='Signing in...';
  try{
    // Try exact key first
    let u=await D.get('users/'+rawUname);
    let matchedUsername=rawUname;

    // If not found, try lowercase key
    if(!u && rawUname !== uname){
      u=await D.get('users/'+uname);
      matchedUsername=uname;
    }

    // If still not found, search all users case-insensitively
    if(!u){
      const allUsers=await D.get('users')||{};
      for(const[un,ud] of Object.entries(allUsers)){
        if(un.toLowerCase()===uname || (ud.username && ud.username.toLowerCase()===uname)){
          u=ud;
          matchedUsername=un;
          break;
        }
      }
    }

    if(!u&&uname==='admin'&&pass==='admin123'){
      try{ await D.set('users/admin',{username:'admin',password:'admin123',role:'admin',full_name:'Administrator',created_at:now()}); seed(); }catch(e){}
      u={username:'admin',password:'admin123',role:'admin',full_name:'Administrator'};
      matchedUsername='admin';
    }

    if(!u && (uname==='keyur123'||uname==='keyur') && pass==='welcome123'){
      u={username:'Keyur123',password:'welcome123',role:'employee',full_name:'Keyur Patel',employee_key:'emp_keyur'};
      matchedUsername='Keyur123';
    }

    if(!u){
      showErr(`Username "${rawUname}" not found. Please check spelling or contact Admin.`);
      btn.disabled=false;btn.textContent='Sign In →';
      return;
    }
    if(String(u.password).trim()!==pass){
      showErr('Wrong password! Please check uppercase/lowercase letters.');
      btn.disabled=false;btn.textContent='Sign In →';
      return;
    }
    if(u.status==='inactive'){
      showErr('Account deactivated. Contact Admin.');
      btn.disabled=false;btn.textContent='Sign In →';
      return;
    }

    me={username:matchedUsername,...u};
    SafeStorage.set('ca_s',JSON.stringify(me));
    D.upd('users/'+matchedUsername,{last_login:now()}).catch(()=>{});
    startApp();
  }catch(e){
    console.error('Login error:', e);
    showErr('Connection error (' + (e.message || 'Check internet') + '). Please retry.');
    btn.disabled=false;btn.textContent='Sign In →';
  }
}
function showErr(msg){const e=$('login-err');e.textContent='⚠️ '+msg;e.style.display='block';}

function buildNav(){
  const isA=me.role==='admin';
  $('sb-nav').innerHTML=(isA?A_NAV:E_NAV).map(n=>`<button class="snav-btn" id="sn-${n.p}" onclick="nav('${n.p}')"><span class="snav-icon">${n.i}</span><span>${n.l}</span></button>`).join('');
  $('mobile-nav').innerHTML=(isA?A_BNAV:E_BNAV).map(n=>`<button class="mnav-btn" id="mn-${n.p}" onclick="nav('${n.p}')"><span class="mnav-icon">${n.i}</span><span class="mnav-lbl">${n.l}</span></button>`).join('');
}
function setActive(p){
  document.querySelectorAll('.snav-btn,.mnav-btn').forEach(b=>b.classList.remove('active'));
  ['sn-','mn-'].forEach(pre=>{const b=$(pre+p);if(b)b.classList.add('active');});
  $('mb-title').textContent=TITLES[p]||'CA Training';
}

function nav(page,state={}){
  curPage=page;curState=state;setActive(page);
  try{$('page-wrap').scrollTop=0;}catch{}
  setPage(`<div class="loading-pg"><div class="spin"></div></div>`);

async function pgWatch(state={}){
  const{vk,ek,sk}=state;
  const video=await D.get(`videos/${vk}`);if(!video){setPage('<div style="padding:20px">Not found</div>');return;}
  const subj=await D.get(`subjects/${video.subject_key}`);
  const vp=await D.get(`progress/${ek}/${vk}`);
  const done=vp?.status==='completed';
  const upd={last_accessed:now(),attempts:(vp?.attempts||0)+1};
  if(!vp)upd.status='in_progress',upd.start_date=now();
  else if(!done)upd.status='in_progress';
  await D.upd(`progress/${ek}/${vk}`,upd).catch(()=>{});
  const src=ytSrc(video.youtube_url);
  setPage(`
  <div style="max-width:860px">
    <div class="back-btn" onclick="nav('subj-detail',{sk:'${sk||video.subject_key}',ek:'${ek}'})">← Back to ${subj?.name||'Subject'}</div>
    <div class="fw7 mb2" style="font-size:16px;line-height:1.4">${video.title}</div>
    <div class="flex gap2 mb3 fwrap">
      ${subj?badge(subj.icon+' '+subj.name,'b-blue'):''}
      ${badge(video.language||'Hindi','b-gray')}
      ${done?badge('✓ Completed','b-green'):''}
    </div>
    <div class="card mb3" style="padding:0;overflow:hidden">
      ${src?`<div class="yt-wrap"><iframe src="${src}" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" frameborder="0"></iframe></div>`:''}
      <div style="background:#F8FAFC;padding:12px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;">
        <span class="xs gray">💡 If video doesn't play inside app:</span>
        <a href="${video.youtube_url}" target="_blank" class="btn btn-navy btn-xs" style="text-decoration:none;">▶ Open in YouTube App ↗</a>
      </div>
    </div>
    ${video.remarks?`<div class="ibox i-blue mb3"><span style="font-size:20px">📖</span><div><div class="fw7 mb1" style="color:#1E40AF">Notes & Topics Covered</div><div class="sm" style="color:#1E3A5F;line-height:1.7">${video.remarks}</div></div></div>`:''}
    <div class="ibox i-amber mb4"><span style="font-size:20px">⚠️</span><div class="sm" style="color:#78350F;line-height:2">▶ Watch the complete video carefully<br>✅ Click <strong>Mark as Completed</strong> after watching</div></div>
    <div id="comp-box">${compBox(done,vp)}</div>
  </div>`);
  window._done=async()=>{
    const n=now();
    const cur=await D.get(`progress/${ek}/${vk}`);
    if(!cur)await D.set(`progress/${ek}/${vk}`,{status:'completed',start_date:n,completion_date:n,last_accessed:n,attempts:1});
    else await D.upd(`progress/${ek}/${vk}`,{status:'completed',completion_date:n,last_accessed:n});
    const emp=await D.get(`employees/${ek}`);
    audit('complete_video',`${emp?.full_name||ek} completed "${video.title}"`);
    toast('🎉 Marked as Completed!');
    const updated=await D.get(`progress/${ek}/${vk}`);
    $('comp-box').innerHTML=compBox(true,updated);
  };
}
function compBox(done,vp){
  if(done)return`<div class="ibox i-green" style="padding:20px"><span style="font-size:30px">✅</span><div><div class="fw7" style="color:#166534;font-size:16px">Completed!</div>${vp?.completion_date?`<div class="sm mt1" style="color:#15803D">${fdate(vp.completion_date)} at ${ftime(vp.completion_date)}</div>`:''}</div></div>`;
  return`<div class="card tc" style="padding:28px;border:2px dashed var(--border)"><div class="gray fw7 mb3">After watching, mark it as done:</div><button class="btn btn-green btn-block" style="font-size:16px;padding:16px" onclick="window._done()">✓ Mark as Completed</button><div class="xs gray mt3">Only mark after fully watching</div></div>`;
}

async function saveAdminCredentials(){
  const newU=$('adm-new-user').value.trim().toLowerCase();
  const newP=$('adm-new-pass').value.trim();
  if(!newU||!newP){ toast('Username and password cannot be empty','err'); return; }
  
  const oldU=me.username;
  try{
    if(newU!==oldU){
      const exists=await D.get('users/'+newU);
      if(exists){ toast('That username is already taken!','err'); return; }
      // Get current admin object
      const currData=await D.get('users/'+oldU)||{role:'admin',full_name:me.full_name||'Administrator'};
      currData.username=newU;
      currData.password=newP;
      // Write new key and remove old
      await D.set('users/'+newU,currData);
      await D.del('users/'+oldU);
      me.username=newU;
    }else{
      await D.upd('users/'+oldU,{password:newP});
    }
    
    // Update local session
    me.password=newP;
    SafeStorage.set('ca_s',JSON.stringify(me));
    audit('change_admin_credentials',`Admin username/password updated`);
    toast('✓ Admin credentials updated successfully!');
    $('sb-name').textContent=me.full_name||me.username;
    pgSettings();
  }catch(e){
    toast('Error updating credentials: '+e.message,'err');
  }
}

async function saveEmpCred(ek){
  const origU=$('ec-orig-uname').value.trim().toLowerCase();
  const newU=$('ec-uname').value.trim().toLowerCase();
  const newP=$('ec-pass').value.trim();
  const emp=await D.get(`employees/${ek}`);

  if(!newU||!newP){ toast('Username and password are required','err'); return; }

  try{
    if(newU!==origU){
      const exists=await D.get('users/'+newU);
      if(exists){ toast('This username is already taken by someone else!','err'); return; }
      
      let uData={username:newU,password:newP,role:'employee',employee_key:ek,full_name:emp?.full_name||'',status:emp?.status||'active',created_at:now()};
      if(origU){
        const oldData=await D.get('users/'+origU);
        if(oldData) uData={...oldData,username:newU,password:newP};
        await D.del('users/'+origU);
      }
      await D.set('users/'+newU,uData);
    }else{
      await D.upd('users/'+origU,{password:newP});
    }

    audit('update_emp_credentials',`Updated credentials for ${emp?.full_name||ek} (ID: ${newU})`);
    closeModal();
    toast(`✓ Updated! Login: ${newU} / ${newP}`);
    if(curPage==='employees') nav('employees');
    else if(curPage==='settings') nav('settings');
    else if(curPage==='emp-profile') nav('emp-profile',{k:ek});
  }catch(e){
    toast('Error saving credentials: '+e.message,'err');
  }
}

async function openAddEmp(){const subjs=await getSubjs();openModal('Add Employee',`<div class="frow"><div class="form-group"><label class="flabel2">Employee ID *</label><input class="finput2" id="f-eid" placeholder="EMP001"/></div><div class="form-group"><label class="flabel2">Full Name *</label><input class="finput2" id="f-name" placeholder="Full name"/></div></div><div class="frow"><div class="form-group"><label class="flabel2">Designation</label><input class="finput2" id="f-desig" placeholder="Article, Manager..."/></div><div class="form-group"><label class="flabel2">Mobile</label><input class="finput2" id="f-mob" type="tel" placeholder="Mobile number"/></div></div><div class="frow"><div class="form-group"><label class="flabel2">Joining Date</label><input class="finput2" id="f-join" type="date"/></div><div class="form-group"><label class="flabel2">Department</label><input class="finput2" id="f-dept" placeholder="Accounts, Tax..."/></div></div><div class="frow"><div class="form-group"><label class="flabel2">Username * (login ID)</label><input class="finput2" id="f-uname" placeholder="e.g. rahul" autocapitalize="none"/></div><div class="form-group"><label class="flabel2">Password *</label><input class="finput2" id="f-pass" value="welcome123"/></div></div><div class="form-group mt3"><label class="flabel2">Assign Subjects</label><div class="check-grid mt2">${subjs.map(s=>`<label class="check-item"><input type="checkbox" class="scheck" value="${s._k}" checked/>${s.icon} ${s.name}</label>`).join('')}</div></div><div class="flex gap3 mt4"><button class="btn btn-navy flex1" onclick="saveEmp()">Add Employee</button><button class="btn btn-gray flex1" onclick="closeModal()">Cancel</button></div>`);}
async function saveEmp(){const eid=$('f-eid').value.trim(),name=$('f-name').value.trim(),uname=$('f-uname').value.trim().toLowerCase(),pass=$('f-pass').value.trim();if(!eid||!name||!uname||!pass){toast('Fill required fields (*)','err');return;}if(await D.get('users/'+uname)){toast('Username already exists','err');return;}const ek=await D.push('employees',{employee_id:eid,full_name:name,designation:$('f-desig').value.trim(),department:$('f-dept').value.trim(),mobile:$('f-mob').value.trim(),joining_date:$('f-join').value||null,status:'active',created_at:now()});await D.set(`users/${uname}`,{username:uname,password:pass,role:'employee',employee_key:ek,full_name:name,status:'active',created_at:now()});for(const c of document.querySelectorAll('.scheck:checked'))await D.set(`assignments/${ek}/${c.value}`,true);audit('add_employee',`Added ${name} (${uname})`);closeModal();toast(`✓ ${name} added! Login: ${uname} / ${pass}`);nav('employees');}

async function openEditEmp(k){
  const e=await D.get(`employees/${k}`),subjs=await getSubjs(),ak=await asgn(k);
  const allUsers=await D.get('users')||{};
  let curU='', curP='';
  for(const[un,u] of Object.entries(allUsers)){
    if(u.employee_key===k){ curU=un; curP=u.password||''; break; }
  }
  openModal('Edit Employee',`
    <div class="frow">
      <div class="form-group"><label class="flabel2">Full Name *</label><input class="finput2" id="f-name" value="${e.full_name||''}"/></div>
      <div class="form-group"><label class="flabel2">Designation</label><input class="finput2" id="f-desig" value="${e.designation||''}"/></div>
    </div>
    <div class="frow">
      <div class="form-group"><label class="flabel2">Mobile</label><input class="finput2" id="f-mob" value="${e.mobile||''}" type="tel"/></div>
      <div class="form-group"><label class="flabel2">Joining Date</label><input class="finput2" id="f-join" type="date" value="${e.joining_date||''}"/></div>
    </div>
    <div class="frow" style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:10px;margin-bottom:14px">
      <div class="form-group" style="margin-bottom:0">
        <label class="flabel2">Login ID (Username)</label>
        <input class="finput2" id="f-edit-uname" value="${curU}" autocapitalize="none"/>
        <input type="hidden" id="f-edit-orig-uname" value="${curU}"/>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="flabel2">Password</label>
        <input class="finput2" id="f-edit-pass" value="${curP}"/>
      </div>
    </div>
    <div class="form-group"><label class="flabel2">Assign Subjects</label><div class="check-grid mt2">${subjs.map(s=>`<label class="check-item"><input type="checkbox" class="scheck" value="${s._k}" ${ak.includes(s._k)?'checked':''}/>${s.icon} ${s.name}</label>`).join('')}</div></div>
    <div class="flex gap3 mt4"><button class="btn btn-navy flex1" onclick="updEmp('${k}')">Update Details</button><button class="btn btn-gray flex1" onclick="closeModal()">Cancel</button></div>
  `);
}

async function updEmp(k){
  const newName=$('f-name').value.trim();
  const origU=$('f-edit-orig-uname').value.trim().toLowerCase();
  const newU=$('f-edit-uname').value.trim().toLowerCase();
  const newP=$('f-edit-pass').value.trim();

  await D.upd(`employees/${k}`,{full_name:newName,designation:$('f-desig').value.trim(),mobile:$('f-mob').value.trim(),joining_date:$('f-join').value||null});
  await D.del(`assignments/${k}`);
  for(const c of document.querySelectorAll('.scheck:checked'))await D.set(`assignments/${k}/${c.value}`,true);

  // Update user credentials if provided
  if(newU && newP){
    if(newU!==origU){
      const exists=await D.get('users/'+newU);
      if(exists){ toast('That username is already taken! Employee info saved without username change.','err'); }
      else {
        let uData={username:newU,password:newP,role:'employee',employee_key:k,full_name:newName,status:'active',created_at:now()};
        if(origU){
          const oldData=await D.get('users/'+origU);
          if(oldData) uData={...oldData,username:newU,password:newP,full_name:newName};
          await D.del('users/'+origU);
        }
        await D.set('users/'+newU,uData);
      }
    }else if(origU){
      await D.upd('users/'+origU,{password:newP,full_name:newName});
    }
  }

  closeModal();toast('Updated successfully!');nav('employees');
}
async function deactivateEmp(k,name){if(!confirm(`Deactivate ${name}?`))return;await D.upd(`employees/${k}`,{status:'inactive'});const users=await D.get('users')||{};for(const[un,u] of Object.entries(users))if(u.employee_key===k){await D.upd(`users/${un}`,{status:'inactive'});break;}toast('Deactivated');nav('employees');}
